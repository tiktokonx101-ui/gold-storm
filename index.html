<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD STORM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0e;
      color: white;
    }
    header {
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
    }
    .logo {
      color: #d9b65d;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }
    .hero {
      min-height: 75vh;
      padding: 100px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: radial-gradient(ellipse at center, #292313, #0b0b0e 70%);
      text-align: center;
    }
    h1 {
      font-size: clamp(42px, 9vw, 85px);
      margin: 0 0 20px;
      color: #e2c16d;
      letter-spacing: 5px;
    }
    p {
      color: #c5c5c5;
      line-height: 1.8;
      font-size: 18px;
    }
    .btn {
      display: inline-block;
      margin: 25px auto 0;
      padding: 15px 30px;
      border: 1px solid #d9b65d;
      border-radius: 5px;
      color: #e2c16d;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      border-top: 1px solid #292929;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GOLD STORM</div>
    <nav><a href="#home">Home</a></nav>
  </header>
  <main class="hero" id="home">
    <p>WELCOME TO</p>
    <h1>GOLD STORM</h1>
    <p>A new experience begins here.</p>
    <a class="btn" href="#about">DISCOVER MORE</a>
  </main>
  <footer id="about">© 2026 GOLD STORM. All rights reserved.</footer>
</body>
</html>
